<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santet Online V.1.5</title>
    <style>
        body {
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: "Tahoma", sans-serif;
            padding: 10px; /* Tambahan padding agar tidak mentok di pinggir HP */
            box-sizing: border-box;
        }
        .window {
            background-color: #f0f0f0;
            border: 2px solid #999;
            border-top-color: #fff;
            border-left-color: #fff;
            width: 100%; /* Ubah menjadi 100% */
            max-width: 450px; /* Batas maksimal lebar untuk PC */
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        }
        .title-bar {
            background: linear-gradient(to right, #0058e6, #3a93ff);
            color: white;
            padding: 5px 10px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .title-bar-controls span {
            background-color: #ece9d8;
            color: black;
            border: 1px solid #fff;
            border-bottom-color: #666;
            border-right-color: #666;
            padding: 1px 6px;
            font-size: 12px;
            cursor: default;
            margin-left: 2px;
        }
        .content {
            padding: 15px 20px;
            font-size: 13px;
        }
        .form-group {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }
        .form-group label {
            width: 200px;
        }
        .form-group input[type="text"], .form-group select {
            flex: 1;
            padding: 5px; /* Sedikit dilebarkan agar mudah diketik di HP */
            border: 1px solid #7f9db9;
            box-sizing: border-box;
            width: 100%;
        }
        .checkbox-group {
            margin: 15px 0;
        }
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        .btn {
            background-color: #f0f0f0;
            border: 1px solid #fff;
            border-bottom-color: #666;
            border-right-color: #666;
            padding: 6px 20px;
            cursor: pointer;
            font-family: "Tahoma", sans-serif;
            font-size: 13px;
        }
        .btn:active {
            border: 1px solid #666;
            border-bottom-color: #fff;
            border-right-color: #fff;
        }
        .footer-text {
            text-align: right;
            color: #666;
            font-size: 11px;
            margin-top: 15px;
        }

        /* MEDIA QUERY UNTUK TAMPILAN HP */
        @media (max-width: 480px) {
            .form-group {
                flex-direction: column;
                align-items: flex-start;
            }
            .form-group label {
                width: 100%;
                margin-bottom: 5px; /* Jarak antara teks dan kolom input */
            }
            .action-buttons {
                flex-direction: column;
                gap: 10px;
            }
            .btn {
                width: 100%; /* Tombol melebar penuh di HP agar mudah ditekan */
            }
        }
    </style>
</head>
<body>

    <div class="window">
        <div class="title-bar">
            <span>Santet Online V.1.5</span>
            <div class="title-bar-controls">
                <span>_</span><span>☐</span><span style="color:red; font-weight:bold;">X</span>
            </div>
        </div>
        
        <div class="content">
            <form name="santet-form" id="santetForm">
                <div class="form-group">
                    <label>Santet Atas Nama :</label>
                    <input type="text" name="pengirim" required>
                </div>
                
                <div class="form-group">
                    <label>Nama Orang Yang Mau Di Santet :</label>
                    <input type="text" name="target" required>
                </div>
                
                <div class="form-group">
                    <label>Jenis Santet :</label>
                    <input type="text" name="jenis" placeholder="Masukkan jenis santet..." required>
                </div>
                
                <div class="checkbox-group">
                    <label>
                        <input type="checkbox" name="permanen" value="Ya"> Santet Permanen
                    </label>
                </div>
                
                <div class="action-buttons">
                    <button type="submit" class="btn" id="btnSubmit">Mulai Santet</button>
                    <button type="reset" class="btn">Batal Santet</button>
                </div>
                
                <div class="footer-text">
                    Santet Online V.1.5 Beta
                </div>
            </form>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxLRShvuBZOgMo--8kQQNnFIzggzbHvCArxXESdJEXmXGbrgc6Rt1R6eCEjD11OaA4hQw/exec';
        const form = document.forms['santet-form'];
        const btnSubmit = document.getElementById('btnSubmit');

        form.addEventListener('submit', e => {
            e.preventDefault();
            btnSubmit.innerText = 'Memproses...';
            btnSubmit.disabled = true;

            fetch(scriptURL, { method: 'POST', body: new FormData(form)})
                .then(response => {
                    alert('Proses Selesai! Santet Telah Diterima Oleh Orang Yang Bersangkutan.');
                    btnSubmit.innerText = 'Mulai Santet';
                    btnSubmit.disabled = false;
                    form.reset();
                })
                .catch(error => {
                    alert('Gagal mengirim! Server Santet Sedang Gangguan.');
                    btnSubmit.innerText = 'Mulai Santet';
                    btnSubmit.disabled = false;
                });
        });
    </script>
</body>
</html>
